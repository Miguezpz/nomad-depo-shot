<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>Depo Shot Scheduler</title>
    <!-- Link to CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <!-- Header with logo -->
    <div class="header-title">
        <img src="assets/favicon.png" alt="Depo Shot Logo" class="logo">
        <h2>Depo Shot Scheduler</h2>
    </div>
    
    <label for="lastShotDate">Date of last injection:</label>
    <input type="date" id="lastShotDate">
    <button id="calculateBtn">Calculate Next Appointment</button>

    <!-- Added aria-live for accessibility -->
    <div id="resultContainer" class="result-box" aria-live="polite"></div>
</div>

<!-- Link to JavaScript file -->
<script src="script.js"></script>

</body>
</html>
